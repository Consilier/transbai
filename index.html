if (W.measure) {
  const panel = document.getElementById("meas");
  let active = false, done = false, pts = [], line = null, area = null, marks = [];

  const fmtLen = m => m < 1000 ? m.toFixed(1) + " m" : (m / 1000).toFixed(3) + " km";
  const fmtArea = m2 => m2 < 10000 ? m2.toFixed(1) + " m²"
    : (m2 < 1000000 ? (m2 / 10000).toFixed(4) + " ha" : (m2 / 1000000).toFixed(4) + " km²");

  function sphericalArea(ring) {
    const R = 6378137, rad = Math.PI / 180;
    let sum = 0;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      sum += (ring[i].lng - ring[j].lng) * rad *
             (2 + Math.sin(ring[j].lat * rad) + Math.sin(ring[i].lat * rad));
    }
    return Math.abs(sum * R * R / 2);
  }

  function redraw() {
    let total = 0;
    for (let i = 1; i < pts.length; i++) total += map.distance(pts[i - 1], pts[i]);
    if (line) map.removeLayer(line);
    if (area) map.removeLayer(area);
    line = area = null;
    if (pts.length > 1) {
      line = L.polyline(pts, { color: "#b4472f", weight: 2, dashArray: "5,4" }).addTo(map);
    }
    if (pts.length > 2) {
      area = L.polygon(pts, { color: "#b4472f", weight: 0, fillOpacity: .12 }).addTo(map);
    }
    panel.innerHTML = pts.length < 2
      ? "<b>Măsurare:</b> clic pentru puncte, dublu-clic pentru final, Esc anulează"
      : "<b>Lungime</b> " + fmtLen(total) +
        (pts.length > 2 ? "&nbsp;&nbsp;<b>Suprafață</b> " + fmtArea(sphericalArea(pts)) : "");
  }

  function reset() {
    marks.forEach(m => map.removeLayer(m));
    marks = []; pts = []; done = false;
    if (line) map.removeLayer(line);
    if (area) map.removeLayer(area);
    line = area = null;
  }

  function stop(btn) {
    active = false;
    MEASURING = false;
    map.doubleClickZoom.enable();
    reset();
    panel.classList.remove("on");
    document.getElementById("map").classList.remove("measure-cursor");
    if (btn) btn.classList.remove("on");
  }

  const btn = toolButton("measure", "Măsoară distanțe și suprafețe", b => {
    if (active) { stop(b); return; }
    active = true;
    MEASURING = true;
    map.doubleClickZoom.disable();
    b.classList.add("on");
    panel.classList.add("on");
    document.getElementById("map").classList.add("measure-cursor");
    redraw();
  });

  map.on("click", ev => {
    if (!active) return;
    if (done) { reset(); redraw(); }   // o nouă măsurătoare
    pts.push(ev.latlng);
    marks.push(L.circleMarker(ev.latlng, { radius: 3.5, color: "#b4472f", weight: 2,
      fillColor: "#fff", fillOpacity: 1 }).addTo(map));
    redraw();
  });
  // dublu-clic închide măsurătoarea, dar păstrează rezultatul pe ecran
  map.on("dblclick", () => { if (active) done = true; });
  document.addEventListener("keydown", ev => {
    if (ev.key === "Escape" && active) stop(btn);
  });
}

if (W.search) {
  const input = document.getElementById("q");
  const list = document.getElementById("hits");

  const hide = () => { list.classList.remove("on"); list.innerHTML = ""; };
  function render(items) {
    if (!items.length) { hide(); return; }
    list.innerHTML = "";
    items.slice(0, 25).forEach(it => {
      const row = document.createElement("div");
      row.innerHTML = esc(it.label) + '<span class="src">' + esc(it.source) + "</span>";
      row.addEventListener("click", () => { it.go(); hide(); });
      list.appendChild(row);
    });
    list.classList.add("on");
  }

  function searchData(term) {
    const needle = term.toLowerCase();
    const found = [];
    entries.forEach(e => {
      if (!e.raw || !e.cfg.popup) return;
      for (const f of e.raw.features) {
        if (found.length >= 40) break;
        const props = f.properties || {};
        for (const key of Object.keys(props)) {
          if (key === "_s" || key === "_c" || key === "_p" || key === "_a") continue;
          const val = props[key];
          if (val == null) continue;
          if (String(val).toLowerCase().indexOf(needle) === -1) continue;
          found.push({
            label: String(val), source: e.cfg.name + " · " + key,
            go: () => {
              const at = props._p ? L.latLng(props._p[0], props._p[1]) : null;
              const target = at ? L.latLngBounds(at, at).pad(0.002)
                                : L.geoJSON(f).getBounds();
              map.fitBounds(target, { maxZoom: 18, padding: [40, 40] });
              showInfo([{ name: e.cfg.name, feats: [{ feature: f }] }], target.getCenter());
            }
          });
          break;
        }
      }
    });
    return found;
  }

  let timer = null;
  input.addEventListener("input", () => {
    clearTimeout(timer);
    const term = input.value.trim();
    if (term.length < 2) { hide(); return; }
    timer = setTimeout(() => render(searchData(term)), 180);
  });

  input.addEventListener("keydown", ev => {
    if (ev.key !== "Enter") return;
    const term = input.value.trim();
    if (term.length < 3) return;
    const local = searchData(term);
    fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&countrycodes=ro&q=" +
          encodeURIComponent(term))
      .then(r => r.json())
      .then(rows => {
        const addr = (rows || []).map(r => ({
          label: r.display_name, source: "adresă",
          go: () => {
            const bb = r.boundingbox;
            if (bb) map.fitBounds([[+bb[0], +bb[2]], [+bb[1], +bb[3]]], { maxZoom: 18 });
            else map.setView([+r.lat, +r.lon], 17);
          }
        }));
        const all = local.concat(addr);
        render(all.length ? all : [{ label: "Niciun rezultat", source: "", go: () => {} }]);
      })
      .catch(() => render(local));
  });

  document.addEventListener("click", ev => {
    if (!list.contains(ev.target) && ev.target !== input) hide();
  });
}

function st70(lat, lng) {
  try {
    const c = proj4("EPSG:4326", "EPSG:3844", [lng, lat]);
    return { x: c[1], y: c[0] };   // convenția românească: X = nord, Y = est
  } catch (err) { return null; }
}

function fmtST70(lat, lng) {
  const c = st70(lat, lng);
  if (!c) return "";
  const f = n => n.toLocaleString("ro-RO", { minimumFractionDigits: 2,
                                             maximumFractionDigits: 2 });
  return "X " + f(c.x) + "  Y " + f(c.y);
}

// La tipărire, un pixel CSS este 1/96 inch. Pragurile de scară ale etichetelor
// folosesc convenția OGC (0,28 mm/px), deci cele două calcule sunt separate.
const PX_PER_M = 96 / 0.0254;

function zoomForPrintScale(denominator) {
  const lat = map.getCenter().lat;
  return Math.log2(156543.03392 * Math.cos(lat * Math.PI / 180) * PX_PER_M / denominator);
}

function scaleText(m, factor) {
  // scara la latitudinea centrului, raportată la pixelul de coală (96 dpi)
  const src = m || map;
  const lat = src.getCenter().lat;
  const mpp = 156543.03392 * Math.cos(lat * Math.PI / 180) / Math.pow(2, src.getZoom());
  const denom = Math.round(mpp * PX_PER_M * (factor || 1));
  const round = denom > 2000 ? 500 : (denom > 500 ? 50 : 10);
  const nice = Math.round(denom / round) * round;
  return "1 : " + (Math.abs(nice - denom) / denom < 0.02 ? nice : denom)
    .toLocaleString("ro-RO");
}

/* Generator PDF vectorial, fără dependențe                                */
/* Geometriile se proiectează în Stereo 70 și se așază pe pagină la scara  */
/* aleasă, deci planul rezultat este metric, cu text selectabil.           */
/* ====================================================================== */

const PT = 72 / 25.4;            // puncte PDF per milimetru
const PAGE_MM = { a4l: [297, 210], a4p: [210, 297], a3l: [420, 297], a3p: [297, 420] };

// â și î există în WinAnsiEncoding; ă, ș, ț nu există în fonturile PDF de bază,
// așa că se scriu ca literă simplă peste care se desenează semnul, vectorial.
const RO_BASE = { "ă": "a", "Ă": "A", "ș": "s", "Ș": "S", "ț": "t", "Ț": "T",
                  "ş": "s", "Ş": "S", "ţ": "t", "Ţ": "T" };
const RO_MARK = { "ă": "breve", "Ă": "breve", "ș": "comma", "Ș": "comma",
                  "ț": "comma", "Ț": "comma", "ş": "comma", "Ş": "comma",
                  "ţ": "comma", "Ţ": "comma" };
// caractere tipografice uzuale, la pozițiile lor din WinAnsiEncoding
const WINANSI = { "—": 0x97, "–": 0x96, "’": 0x92, "‘": 0x91, "“": 0x93, "”": 0x94,
                  "„": 0x84, "…": 0x85, "•": 0x95, "·": 0xB7, "°": 0xB0, "″": 0x94,
                  "×": 0xD7, "±": 0xB1, "€": 0x80, "™": 0x99, "©": 0xA9 };

function pdfText(str) {
  let out = "";
  for (const raw of String(str)) {
    const ch = RO_BASE[raw] || raw;
    const code = WINANSI[ch] !== undefined ? WINANSI[ch] : ch.charCodeAt(0);
    if (code > 255) { out += "-"; continue; }
    if (ch === "(" || ch === ")" || ch === "\\") out += "\\" + ch;
    else if (code < 32 || code > 126) out += "\\" + ("000" + code.toString(8)).slice(-3);
    else out += ch;
  }
  return out;
}

function hexToRgb(hex) {
  const h = (hex || "#000000").replace("#", "");
  const v = h.length === 3 ? h.split("").map(c => c + c).join("") : h;
  const n = parseInt(v, 16);
  if (isNaN(n)) return [0, 0, 0];
  return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
}

};

function num(v) {
  return (Math.round(v * 100) / 100).toString();
}

class PdfDoc {
  constructor(widthMm, heightMm) {
    this.w = widthMm * PT;
    this.h = heightMm * PT;
    this.ops = [];
    this.alphas = {};          // stări de transparență, adăugate la nevoie
  }
  // sistemul PDF are originea jos-stânga; se lucrează cu y de sus în jos
  y(v) { return this.h - v; }

  push(s) { this.ops.push(s); }
  save() { this.push("q"); }
  restore() { this.push("Q"); }

  alpha(fill, stroke) {
    const key = "a" + Math.round(fill * 100) + "_" + Math.round(stroke * 100);
    this.alphas[key] = { ca: fill, CA: stroke };
    this.push("/" + key + " gs");
  }
  fillColor(hex) { const c = hexToRgb(hex); this.push(num(c[0]) + " " + num(c[1]) + " " + num(c[2]) + " rg"); }
  strokeColor(hex) { const c = hexToRgb(hex); this.push(num(c[0]) + " " + num(c[1]) + " " + num(c[2]) + " RG"); }
  lineWidth(w) { this.push(num(Math.max(0.05, w)) + " w"); }
  dash(pattern) {
    if (!pattern) { this.push("[] 0 d"); return; }
    const arr = String(pattern).split(",").map(v => num(parseFloat(v) * 0.75));
    this.push("[" + arr.join(" ") + "] 0 d");
  }
  rect(x, y, w, h) { this.push(num(x) + " " + num(this.y(y + h)) + " " + num(w) + " " + num(h) + " re"); }
  moveTo(x, y) { this.push(num(x) + " " + num(this.y(y)) + " m"); }
  lineTo(x, y) { this.push(num(x) + " " + num(this.y(y)) + " l"); }
  close() { this.push("h"); }
  circle(x, y, r) {
    const k = 0.5523 * r, cy = this.y(y);
    this.push(num(x + r) + " " + num(cy) + " m");
    this.push([num(x + r), num(cy + k), num(x + k), num(cy + r), num(x), num(cy + r), "c"].join(" "));
    this.push([num(x - k), num(cy + r), num(x - r), num(cy + k), num(x - r), num(cy), "c"].join(" "));
    this.push([num(x - r), num(cy - k), num(x - k), num(cy - r), num(x), num(cy - r), "c"].join(" "));
    this.push([num(x + k), num(cy - r), num(x + r), num(cy - k), num(x + r), num(cy), "c"].join(" "));
  }
  // lățimile reale ale glifelor Helvetica, pentru poziționarea semnelor
  charWidth(ch, size, bold) {
    const W = bold ? PdfDocWidths.bold : PdfDocWidths.regular;
    const base = RO_BASE[ch] || ch;
    const code = WINANSI[base] !== undefined ? WINANSI[base] : base.charCodeAt(0);
    const w = W[code];
    return (w === undefined ? 556 : w) / 1000 * size;
  }

  // semnele care lipsesc din fonturile de bază, desenate ca vectori
  drawMark(kind, x, y, size, color, upper) {
    this.save();
    this.strokeColor(color || "#000000");
    this.lineWidth(Math.max(0.25, size * 0.055));
    if (kind === "breve") {
      // deasupra majusculei semnul trebuie ridicat peste înălțimea literei
      const w = size * (upper ? 0.34 : 0.30);
      const top = y - size * (upper ? 0.80 : 0.70);
      const d = size * 0.10;
      this.moveTo(x - w / 2, top);
      this.push(num(x - w / 2) + " " + num(this.y(top + d * 1.7)) + " " +
                num(x + w / 2) + " " + num(this.y(top + d * 1.7)) + " " +
                num(x + w / 2) + " " + num(this.y(top)) + " c");
      this.push("S");
    } else {
      // virgulă sub literă, lipită de linia de bază
      const base = y + size * 0.06;
      this.lineWidth(Math.max(0.22, size * 0.062));
      this.moveTo(x + size * 0.035, base);
      this.lineTo(x - size * 0.02, base + size * 0.155);
      this.push("S");
    }
    this.restore();
  }

  text(str, x, y, size, opts) {
    const o = opts || {};
    const font = o.bold ? "/F2" : "/F1";
    this.save();
    this.fillColor(o.color || "#000000");
    this.push("BT");
    if (o.angle) {
      const a = o.angle * Math.PI / 180, cos = Math.cos(a), sin = Math.sin(a);
      this.push(font + " " + num(size) + " Tf");
      this.push([num(cos), num(sin), num(-sin), num(cos), num(x), num(this.y(y))].join(" ") + " Tm");
    } else {
      this.push(font + " " + num(size) + " Tf");
      this.push(num(x) + " " + num(this.y(y)) + " Td");
    }
    this.push("(" + pdfText(str) + ") Tj");
    this.push("ET");
    this.restore();

    // semnele diacritice, poziționate peste literele deja scrise
    const text = String(str);
    let hasMarks = false;
    for (const ch of text) { if (RO_MARK[ch]) { hasMarks = true; break; } }
    if (!hasMarks || o.angle) return;
    let cursor = x;
    for (const ch of text) {
      const w = this.charWidth(ch, size, o.bold);
      if (RO_MARK[ch]) {
        this.drawMark(RO_MARK[ch], cursor + w / 2, y, size, o.color || "#000000",
                      ch === ch.toUpperCase());
      }
      cursor += w;
    }
  }
  widthOf(str, size, bold) {
    let total = 0;
    for (const ch of String(str)) total += this.charWidth(ch, size, bold);
    return total;
  }

  build() {
    const content = this.ops.join("\n");
    const objs = [];
    const extg = Object.keys(this.alphas).map(k =>
      "/" + k + " << /Type /ExtGState /ca " + this.alphas[k].ca +
      " /CA " + this.alphas[k].CA + " >>").join(" ");

    objs[1] = "<< /Type /Catalog /Pages 2 0 R >>";
    objs[2] = "<< /Type /Pages /Kids [3 0 R] /Count 1 >>";
    objs[3] = "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + num(this.w) + " " + num(this.h) +
      "] /Resources << /Font << /F1 5 0 R /F2 6 0 R >> /ExtGState << " + extg +
      " >> >> /Contents 4 0 R >>";
    objs[4] = "<< /Length " + content.length + " >>\nstream\n" + content + "\nendstream";
    objs[5] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica " +
      "/Encoding /WinAnsiEncoding >>";
    objs[6] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold " +
      "/Encoding /WinAnsiEncoding >>";

    let pdf = "%PDF-1.4\n";
    const offsets = [];
    for (let i = 1; i < objs.length; i++) {
      offsets[i] = pdf.length;
      pdf += i + " 0 obj\n" + objs[i] + "\nendobj\n";
    }
    const xref = pdf.length;
    pdf += "xref\n0 " + objs.length + "\n0000000000 65535 f \n";
    for (let i = 1; i < objs.length; i++) {
      pdf += ("0000000000" + offsets[i]).slice(-10) + " 00000 n \n";
    }
    pdf += "trailer\n<< /Size " + objs.length + " /Root 1 0 R >>\nstartxref\n" + xref + "\n%%EOF";
    return pdf;
  }
}

/* desenarea planului în PDF ---------------------------------------------- */

function buildPdf() {
  const sizeKey = document.getElementById("psize").value;
  const dims = PAGE_MM[sizeKey] || PAGE_MM.a4l;
  const useST70 = document.getElementById("pcrs").value === "st70";
  const withLegend = document.getElementById("pleg").checked;
  const withGrid = document.getElementById("pgrid").checked;
  const withScale = document.getElementById("pscale").checked;
  const scopeVisible = document.getElementById("pscope").value === "view";
  const scaleMode = document.getElementById("pscale2").value;

  const doc = new PdfDoc(dims[0], dims[1]);
  const M = 10 * PT;                       // marginea colii
  const headH = 14 * PT, footH = 7 * PT;
  const legendW = withLegend ? 46 * PT : 0;
  const frame = withGrid ? 7 * PT : 0;

  const area = { x: M, y: M + headH, w: doc.w - 2 * M - legendW,
                 h: doc.h - 2 * M - headH - footH };
  const inner = { x: area.x + frame, y: area.y + frame,
                  w: area.w - 2 * frame, h: area.h - 2 * frame };

  // --- sistemul de coordonate al planului --------------------------------
  const view = scopeVisible ? map.getBounds() : bounds;
  const project = useST70
    ? (lat, lng) => { const c = toST70(lat, lng); return { x: c.e, y: c.n }; }
    : (lat, lng) => { const p = L.CRS.EPSG3857.project(L.latLng(lat, lng));
                      return { x: p.x, y: p.y }; };

  const corners = [
    project(view.getSouth(), view.getWest()), project(view.getSouth(), view.getEast()),
    project(view.getNorth(), view.getWest()), project(view.getNorth(), view.getEast())
  ];
  let minX = Math.min.apply(null, corners.map(c => c.x));
  let maxX = Math.max.apply(null, corners.map(c => c.x));
  let minY = Math.min.apply(null, corners.map(c => c.y));
  let maxY = Math.max.apply(null, corners.map(c => c.y));

  const mmPerUnit = 1000;   // metri → mm
  let scale;                // numitorul scării
  if (scaleMode === "fit" || scaleMode === "width") {
    const sx = (maxX - minX) * mmPerUnit * PT / inner.w;
    const sy = (maxY - minY) * mmPerUnit * PT / inner.h;
    scale = scaleMode === "width" ? sx : Math.max(sx, sy);
  } else {
    scale = parseFloat(scaleMode);
  }
  // scări rotunde pentru varianta automată
  if (scaleMode === "fit" || scaleMode === "width") {
    const nice = [100, 200, 250, 500, 1000, 2000, 2500, 5000, 10000, 20000, 25000,
                  50000, 100000, 200000, 500000];
    for (let i = 0; i < nice.length; i++) {
      if (nice[i] >= scale) { scale = nice[i]; break; }
    }
  }
  const unitToPt = mmPerUnit * PT / scale;   // o unitate de proiecție în puncte
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  const toPage = (p) => ({
    x: inner.x + inner.w / 2 + (p.x - cx) * unitToPt,
    y: inner.y + inner.h / 2 - (p.y - cy) * unitToPt
  });
  const pageOf = (lat, lng) => toPage(project(lat, lng));

  // limitele reale ale cadrului, în unități de proiecție
  const halfW = inner.w / 2 / unitToPt, halfH = inner.h / 2 / unitToPt;
  const box = { minX: cx - halfW, maxX: cx + halfW, minY: cy - halfH, maxY: cy + halfH };

  // --- conținutul hărții --------------------------------------------------
  doc.save();
  doc.rect(inner.x, inner.y, inner.w, inner.h);
  doc.push("W n");                     // decupare la cadrul planului

  const drawn = [];
  for (let i = entries.length - 1; i >= 0; i--) {
    const e = entries[i];
    if (!e.layer || !map.hasLayer(e.layer)) continue;
    if (e.kind !== "vector" || !e.raw) {
      if (e.kind === "tiles" || e.cfg.type === "image" || e.cfg.type === "xyz" ||
          e.cfg.type === "wms") drawn.push(e.cfg.name);
      continue;
    }
    const data = visibleData(e);
    if (!data || !data.features.length) continue;
    data.features.forEach(f => drawFeaturePdf(doc, f, e, pageOf, unitToPt));
  }

  // etichetele, deasupra geometriilor
  entries.forEach((e, i) => {
    if (!e.cfg.labels || e.kind !== "vector" || !e.raw) return;
    if (!e.layer || !map.hasLayer(e.layer)) return;
    const st = e.cfg.labels;
    const data = visibleData(e);
    if (!data) return;
    let count = 0;
    data.features.forEach(f => {
      const props = f.properties || {};
      if (!props._l || !props._p || count > 4000) return;
      const p = project(props._p[0], props._p[1]);
      if (p.x < box.minX || p.x > box.maxX || p.y < box.minY || p.y > box.maxY) return;
      const at = toPage(p);
      const size = Math.max(4, (st.size || 11) * 0.62);
      const w = doc.widthOf(props._l, size, st.bold);
      count++;
      doc.text(props._l, at.x - w / 2, at.y + size * 0.35, size,
        { color: st.color || "#111111", bold: st.bold,
          angle: st.angled && props._a ? -props._a : 0 });
    });
  });
  doc.restore();

  // conturul planului
  doc.strokeColor("#000000");
  doc.lineWidth(0.8);
  doc.rect(inner.x, inner.y, inner.w, inner.h);
  doc.push("S");

  if (withGrid) drawPdfFrame(doc, inner, frame, box, scale, useST70, project, toPage);
  drawPdfHeader(doc, M, headH, footH, scale, useST70, withScale, box, project);
  if (withLegend) {
    drawPdfLegend(doc, doc.w - M - legendW + 4 * PT, area.y, legendW - 4 * PT,
                  area.h, scopeVisible);
  }
  return { doc: doc, scale: scale, raster: drawn };
}

/* geometrii ------------------------------------------------------------- */

function ringToPath(doc, ring, pageOf) {
  for (let i = 0; i < ring.length; i++) {
    const p = pageOf(ring[i][1], ring[i][0]);
    if (i === 0) doc.moveTo(p.x, p.y); else doc.lineTo(p.x, p.y);
  }
  doc.close();
}

function polyPath(doc, coords, pageOf) {
  coords.forEach(ring => ringToPath(doc, ring, pageOf));
}

// hașura se desenează ca linii reale, decupate la poligon: rămâne vectorială
function hatchPdf(doc, coords, pageOf, pattern, unitToPt) {
  const pts = [];
  coords.forEach(ring => ring.forEach(c => pts.push(pageOf(c[1], c[0]))));
  if (!pts.length) return;
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
  const y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);

  doc.save();
  polyPath(doc, coords, pageOf);
  doc.push("W n");
  doc.strokeColor(pattern.color || "#333333");
  doc.lineWidth((pattern.widthM ? pattern.widthM * unitToPt : (pattern.width || 1) * 0.75));
  doc.dash(pattern.dash);

  if (pattern.kind === "dots") {
    const dx = Math.max(2, pattern.dxM ? pattern.dxM * unitToPt : pattern.dx * 0.75);
    const dy = Math.max(2, pattern.dyM ? pattern.dyM * unitToPt : pattern.dy * 0.75);
    doc.fillColor(pattern.color || "#333333");
    let n = 0;
    for (let x = x0; x <= x1 && n < 20000; x += dx) {
      for (let y = y0; y <= y1 && n < 20000; y += dy) {
        doc.circle(x, y, Math.max(0.3, (pattern.radius || 1) * 0.75));
        doc.push("f");
        n++;
      }
    }
  } else {
    const gap = Math.max(1.2, pattern.gapM ? pattern.gapM * unitToPt : pattern.gap * 0.75);
    const a = (pattern.angle || 0) * Math.PI / 180;
    const dx = Math.cos(a), dy = -Math.sin(a);
    const diag = Math.hypot(x1 - x0, y1 - y0);
    const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
    const steps = Math.min(4000, Math.ceil(diag / gap) + 2);
    for (let k = -steps; k <= steps; k++) {
      const ox = -dy * k * gap, oy = dx * k * gap;
      doc.moveTo(mx + ox - dx * diag, my + oy - dy * diag);
      doc.lineTo(mx + ox + dx * diag, my + oy + dy * diag);
      doc.push("S");
    }
  }
  doc.restore();
}

function drawFeaturePdf(doc, feature, entry, pageOf, unitToPt) {
  const geom = feature.geometry;
  if (!geom) return;
  const s = (feature.properties && feature.properties._s) || DEF;
  const weight = s.wM ? s.wM * unitToPt : (s.w == null ? 1 : s.w) * 0.75;
  const fillOp = s.fo == null ? 0.35 : s.fo;
  const strokeOp = s.so == null ? 1 : s.so;

  const polys = geom.type === "Polygon" ? [geom.coordinates]
              : (geom.type === "MultiPolygon" ? geom.coordinates : null);
  if (polys) {
    polys.forEach(coords => {
      if (fillOp > 0) {
        doc.save();
        doc.alpha(fillOp, strokeOp);
        doc.fillColor(s.f || DEF.f);
        polyPath(doc, coords, pageOf);
        doc.push("f*");
        doc.restore();
      }
      if (s.p) {
        doc.save();
        doc.alpha(strokeOp, strokeOp);
        hatchPdf(doc, coords, pageOf, s.p, unitToPt);
        doc.restore();
      }
      if (weight > 0 && strokeOp > 0) {
        doc.save();
        doc.alpha(strokeOp, strokeOp);
        doc.strokeColor(s.s || DEF.s);
        doc.lineWidth(weight);
        doc.dash(s.d);
        polyPath(doc, coords, pageOf);
        doc.push("S");
        doc.restore();
      }
    });
    return;
  }

  const lines = geom.type === "LineString" ? [geom.coordinates]
              : (geom.type === "MultiLineString" ? geom.coordinates : null);
  if (lines) {
    doc.save();
    doc.alpha(strokeOp, strokeOp);
    doc.strokeColor(s.s || DEF.s);
    doc.lineWidth(Math.max(0.15, weight));
    doc.dash(s.d);
    if (s.cap) doc.push({ butt: "0 J", round: "1 J", square: "2 J" }[s.cap] || "1 J");
    if (s.join) doc.push({ miter: "0 j", round: "1 j", bevel: "2 j" }[s.join] || "1 j");
    lines.forEach(line => {
      line.forEach((c, i) => {
        const p = pageOf(c[1], c[0]);
        if (i === 0) doc.moveTo(p.x, p.y); else doc.lineTo(p.x, p.y);
      });
      doc.push("S");
    });
    doc.restore();
    return;
  }

  const points = geom.type === "Point" ? [geom.coordinates]
               : (geom.type === "MultiPoint" ? geom.coordinates : null);
  if (points) {
    const r = Math.max(0.6, s.rM ? s.rM * unitToPt : (s.r || 4) * 0.75);
    doc.save();
    doc.alpha(fillOp || 1, strokeOp);
    doc.fillColor(s.f || DEF.f);
    doc.strokeColor(s.s || "#333333");
    doc.lineWidth(Math.max(0.15, weight));
    points.forEach(c => {
      const p = pageOf(c[1], c[0]);
      doc.circle(p.x, p.y, r);
      doc.push(weight > 0 ? "B" : "f");
    });
    doc.restore();
  }
}

/* cadru, antet și legendă în PDF ----------------------------------------- */

function drawPdfFrame(doc, inner, frame, box, scale, useST70, project, toPage) {
  const spanX = box.maxX - box.minX, spanY = box.maxY - box.minY;
  const step = Math.max(niceStep(spanX, 6), niceStep(spanY, 5));
  const band = frame * 0.6;
  const fs = 5.4;

  const xs = [], ys = [];
  for (let v = Math.ceil(box.minX / step) * step; v <= box.maxX; v += step) xs.push(v);
  for (let v = Math.ceil(box.minY / step) * step; v <= box.maxY; v += step) ys.push(v);

  function zebra(marks, start, end, horizontal, offset) {
    const stops = [start].concat(marks).concat([end]);
    for (let i = 0; i < stops.length - 1; i++) {
      const a = stops[i], b = stops[i + 1];
      if (b - a <= 0) continue;
      const p0 = horizontal
        ? toPage({ x: a, y: box.maxY }).x : toPage({ x: box.minX, y: b }).y;
      const p1 = horizontal
        ? toPage({ x: b, y: box.maxY }).x : toPage({ x: box.minX, y: a }).y;
      const lo = Math.min(p0, p1), hi = Math.max(p0, p1);
      doc.fillColor(i % 2 ? "#000000" : "#ffffff");
      doc.strokeColor("#000000");
      doc.lineWidth(0.35);
      if (horizontal) doc.rect(lo, offset, hi - lo, band);
      else doc.rect(offset, lo, band, hi - lo);
      doc.push("B");
    }
  }
  zebra(xs, box.minX, box.maxX, true, inner.y - band);
  zebra(xs, box.minX, box.maxX, true, inner.y + inner.h);
  zebra(ys, box.minY, box.maxY, false, inner.x - band);
  zebra(ys, box.minY, box.maxY, false, inner.x + inner.w);

  // grila interioară
  doc.save();
  doc.rect(inner.x, inner.y, inner.w, inner.h);
  doc.push("W n");
  doc.strokeColor("#000000");
  doc.lineWidth(0.25);
  doc.dash("2,5");
  doc.alpha(1, 0.45);
  xs.forEach(v => {
    const p = toPage({ x: v, y: box.maxY });
    doc.moveTo(p.x, inner.y);
    doc.lineTo(p.x, inner.y + inner.h);
    doc.push("S");
  });
  ys.forEach(v => {
    const p = toPage({ x: box.minX, y: v });
    doc.moveTo(inner.x, p.y);
    doc.lineTo(inner.x + inner.w, p.y);
    doc.push("S");
  });
  doc.restore();

  const fmt = v => fmtGrid(v, step);
  xs.forEach(v => {
    const p = toPage({ x: v, y: box.maxY });
    const w = doc.widthOf(fmt(v), fs);
    doc.text(fmt(v), p.x - w / 2, inner.y - band - 2, fs);
    doc.text(fmt(v), p.x - w / 2, inner.y + inner.h + band + fs + 1, fs);
  });
  ys.forEach(v => {
    const p = toPage({ x: box.minX, y: v });
    const w = doc.widthOf(fmt(v), fs);
    doc.text(fmt(v), inner.x - band - 2, p.y + w / 2, fs, { angle: 90 });
    doc.text(fmt(v), inner.x + inner.w + band + fs, p.y - w / 2, fs, { angle: -90 });
  });

  const note = "interval " + fmt(step) + (useST70 ? " m · Stereo 70" : "° · WGS84");
  doc.text(note, inner.x + inner.w - doc.widthOf(note, 5) ,
           inner.y + inner.h + band + fs * 2 + 4, 5, { color: "#555555" });
}

function drawPdfHeader(doc, M, headH, footH, scale, useST70, withScale, box, project) {
  const title = document.getElementById("ptitle").value || CFG.title || "Hartă";
  const sub = document.getElementById("psub").value || "";
  doc.text(title, M, M + 10, 13, { bold: true });

  const right = doc.w - M;
  let line = M + 6;
  if (sub) {
    doc.text(sub, right - doc.widthOf(sub, 7.5), line, 7.5, { color: "#444444" });
    line += 9;
  }
  if (withScale) {
    const st = "Scara 1 : " + scale.toLocaleString("ro-RO");
    doc.text(st, right - doc.widthOf(st, 7.5), line, 7.5, { bold: true });
    line += 9;
    const crs = useST70 ? "Stereo 70 (EPSG:3844)" : "WGS84 (EPSG:4326)";
    doc.text(crs, right - doc.widthOf(crs, 6.5), line, 6.5, { color: "#555555" });
  }
  doc.strokeColor("#000000");
  doc.lineWidth(1);
  doc.moveTo(M, M + headH - 4);
  doc.lineTo(doc.w - M, M + headH - 4);
  doc.push("S");

  const y = doc.h - M - 1;
  doc.strokeColor("#999999");
  doc.lineWidth(0.4);
  doc.moveTo(M, y - 9);
  doc.lineTo(doc.w - M, y - 9);
  doc.push("S");

  let coords = "";
  if (withScale) {
    const f = v => v.toLocaleString("ro-RO", { maximumFractionDigits: useST70 ? 1 : 5 });
    coords = useST70
      ? "SV: X " + f(box.minY) + "  Y " + f(box.minX) +
        "     NE: X " + f(box.maxY) + "  Y " + f(box.maxX)
      : "SV: " + f(box.minY) + ", " + f(box.minX) +
        "     NE: " + f(box.maxY) + ", " + f(box.maxX);
  }
  doc.text(coords, M, y - 1, 6, { color: "#555555" });
  const date = new Date().toLocaleString("ro-RO");
  doc.text(date, doc.w - M - doc.widthOf(date, 6), y - 1, 6, { color: "#555555" });
}

function drawPdfLegend(doc, x, y, w, h, scopeVisibleOnly) {
  doc.text("LEGENDĂ", x, y + 8, 7.5, { bold: true });
  doc.strokeColor("#000000");
  doc.lineWidth(0.5);
  doc.moveTo(x, y + 11);
  doc.lineTo(x + w, y + 11);
  doc.push("S");

  let cy = y + 21;
  const sw = 13, sh = 7;
  entries.forEach(e => {
    const cfg = e.cfg;
    if (cfg.noLegend) return;
    if (scopeVisibleOnly && (!cfg.visible || (e.layer && !map.hasLayer(e.layer)))) return;
    if (cy > y + h - 12) return;
    const legend = cfg.legend || [];

    if (legend.length > 1) {
      doc.text(cfg.name, x, cy, 6.6, { bold: true });
      cy += 8;
    }
    const items = legend.length ? legend : [{ s: DEF, g: cfg.geom, label: cfg.name }];
    items.forEach((it, k) => {
      if (legend.length > 1 && e.hidden.has(k)) return;
      if (cy > y + h - 8) return;
      const st = it.s || DEF;
      const label = legend.length > 1 ? it.label : cfg.name;
      const geom = it.g || cfg.geom;

      doc.save();
      if (geom === "line") {
        doc.strokeColor(st.s || DEF.s);
        doc.lineWidth(Math.max(0.4, (st.w || 1) * 0.75));
        doc.dash(st.d);
        doc.moveTo(x, cy - 2);
        doc.lineTo(x + sw, cy - 2);
        doc.push("S");
      } else if (geom === "point") {
        doc.fillColor(st.f || DEF.f);
        doc.strokeColor(st.s || "#333333");
        doc.lineWidth(0.4);
        doc.circle(x + sw / 2, cy - 2, Math.min(3, st.r || 2.5));
        doc.push("B");
      } else {
        if ((st.fo == null ? 0.35 : st.fo) > 0) {
          doc.alpha(st.fo == null ? 0.35 : st.fo, 1);
          doc.fillColor(st.f || DEF.f);
          doc.rect(x, cy - sh + 1, sw, sh);
          doc.push("f");
        }
        if (st.p) {
          const ring = [[[0, 0]]];   // dreptunghiul de mostră, în coordonate de pagină
          doc.save();
          doc.rect(x, cy - sh + 1, sw, sh);
          doc.push("W n");
          doc.strokeColor(st.p.color || "#333333");
          doc.lineWidth(0.4);
          const a = (st.p.angle || 0) * Math.PI / 180;
          const dx = Math.cos(a), dy = -Math.sin(a);
          for (let k2 = -6; k2 <= 6; k2++) {
            doc.moveTo(x + sw / 2 - dy * k2 * 2.2 - dx * sw, cy - 2 + dx * k2 * 2.2 - dy * sw);
            doc.lineTo(x + sw / 2 - dy * k2 * 2.2 + dx * sw, cy - 2 + dx * k2 * 2.2 + dy * sw);
            doc.push("S");
          }
          doc.restore();
        }
        doc.alpha(1, 1);
        doc.strokeColor(st.s || DEF.s);
        doc.lineWidth(Math.max(0.3, Math.min(1.2, (st.w || 0.5) * 0.75)));
        doc.rect(x, cy - sh + 1, sw, sh);
        doc.push("S");
      }
      doc.restore();

      const maxChars = Math.floor((w - sw - 4) / (6 * 0.5));
      const text = label.length > maxChars ? label.slice(0, maxChars - 1) + "…" : label;
      doc.text(text, x + sw + 4, cy, 6);
      cy += 10;
    });
    cy += 4;
  });
}

function savePdf() {
  let result;
  try {
    result = buildPdf();
  } catch (err) {
    alert("Generarea PDF a eșuat: " + err.message);
    return;
  }
  const bytes = result.doc.build();
  const buf = new Uint8Array(bytes.length);
  for (let i = 0; i < bytes.length; i++) buf[i] = bytes.charCodeAt(i) & 0xff;
  const url = URL.createObjectURL(new Blob([buf], { type: "application/pdf" }));
  const a = document.createElement("a");
  a.href = url;
  const name = (document.getElementById("ptitle").value || CFG.title || "harta")
    .replace(/[^\w\-]+/g, "_");
  a.download = name + "_1-" + result.scale + ".pdf";
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  closePrint();
  if (result.raster.length) {
    setTimeout(() => alert("PDF-ul conține doar straturile vectoriale. Straturile " +
      "raster sau în tile-uri (" + result.raster.join(", ") +
      ") nu pot fi vectorizate — folosiți tipărirea pentru ele."), 300);
  }
}

/* cadru zebrat cu coordonate --------------------------------------------- */
const FRAME_PX = 26;          // lățimea ramei, în pixeli de coală
const GRID_STEPS = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500,
                    1000, 2000, 2500, 5000, 10000, 20000, 50000];

function niceStep(span, target) {
  const raw = span / Math.max(2, target);
  for (let i = 0; i < GRID_STEPS.length; i++) {
    if (GRID_STEPS[i] >= raw) return GRID_STEPS[i];
  }
  return GRID_STEPS[GRID_STEPS.length - 1];
}

function toST70(lat, lng) {
  const c = proj4("EPSG:4326", "EPSG:3844", [lng, lat]);
  return { e: c[0], n: c[1] };      // e = est (Y), n = nord (X)
}
function fromST70(e, n) {
  const c = proj4("EPSG:3844", "EPSG:4326", [e, n]);
  return L.latLng(c[1], c[0]);
}

function fmtGrid(value, step) {
  const dec = step < 1 ? 2 : 0;
  return value.toLocaleString("ro-RO", { minimumFractionDigits: dec,
                                         maximumFractionDigits: dec, useGrouping: true });
}

// Liniile de grilă se caută prin bisecție pe fiecare latură: în Web Mercator o
// linie Stereo 70 nu e perfect verticală, iar poziția exactă pe ramă contează.
function crossings(m, axis, isTop, step, useST70, k) {
  k = k || 1;
  const size = m.getSize();
  const horizontal = axis === "x";
  const fixed = horizontal ? (isTop ? 0 : size.y) : (isTop ? 0 : size.x);
  const valueAt = pos => {
    const p = horizontal ? L.point(pos * k, fixed) : L.point(fixed, pos * k);
    const ll = m.containerPointToLatLng(p);
    if (!useST70) return horizontal ? ll.lng : ll.lat;
    const c = toST70(ll.lat, ll.lng);
    return horizontal ? c.e : c.n;
  };
  const limit = (horizontal ? size.x : size.y) / k;
  const v0 = valueAt(2), v1 = valueAt(limit - 2);
  const lo = Math.min(v0, v1), hi = Math.max(v0, v1);
  const out = [];
  const first = Math.ceil(lo / step) * step;
  for (let v = first; v <= hi && out.length < 60; v += step) {
    let a = 2, b = limit - 2;
    for (let k = 0; k < 24; k++) {
      const mid = (a + b) / 2;
      const vm = valueAt(mid);
      if ((valueAt(a) - v) * (vm - v) <= 0) b = mid; else a = mid;
    }
    out.push({ pos: (a + b) / 2, value: v });
  }
  return out;
}

function drawFrame(m, holder, useST70) {
  const k = m._dpiFactor || 1;
  const raw = m.getSize();
  const size = L.point(raw.x / k, raw.y / k);
  const W = size.x + FRAME_PX * 2, H = size.y + FRAME_PX * 2;
  const spanX = Math.abs((useST70
    ? toST70(m.getCenter().lat, m.getBounds().getEast()).e -
      toST70(m.getCenter().lat, m.getBounds().getWest()).e
    : m.getBounds().getEast() - m.getBounds().getWest()));
  const spanY = Math.abs((useST70
    ? toST70(m.getBounds().getNorth(), m.getCenter().lng).n -
      toST70(m.getBounds().getSouth(), m.getCenter().lng).n
    : m.getBounds().getNorth() - m.getBounds().getSouth()));
  const step = Math.max(niceStep(spanX, 6), niceStep(spanY, 5));

  const top = crossings(m, "x", true, step, useST70, k);
  const bottom = crossings(m, "x", false, step, useST70, k);
  const left = crossings(m, "y", true, step, useST70, k);
  const right = crossings(m, "y", false, step, useST70, k);

  const svg = ['<svg class="frame" width="' + W + '" height="' + H +
    '" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">'];
  const F = FRAME_PX, IB = 9;   // IB = grosimea benzii zebrate
  const inner = { x: F, y: F, w: size.x, h: size.y };

  // fundalul alb se pune DOAR pe ramă: un dreptunghi pe toată suprafața ar
  // acoperi harta, fiindcă SVG-ul stă deasupra ei
  svg.push('<g fill="#fff">' +
    '<rect x="0" y="0" width="' + W + '" height="' + F + '"/>' +
    '<rect x="0" y="' + (H - F) + '" width="' + W + '" height="' + F + '"/>' +
    '<rect x="0" y="0" width="' + F + '" height="' + H + '"/>' +
    '<rect x="' + (W - F) + '" y="0" width="' + F + '" height="' + H + '"/>' +
    "</g>");
  svg.push('<rect x="' + inner.x + '" y="' + inner.y + '" width="' + inner.w +
    '" height="' + inner.h + '" fill="none" stroke="#111" stroke-width="0.8"/>');

  // benzile alternante, pe fiecare latură, între liniile de grilă
  function zebra(marks, along, isVertical, offset) {
    const limit = isVertical ? inner.h : inner.w;
    const stops = [0].concat(marks.map(mk => mk.pos)).concat([limit]);
    for (let i = 0; i < stops.length - 1; i++) {
      const a = Math.max(0, Math.min(limit, stops[i]));
      const b = Math.max(0, Math.min(limit, stops[i + 1]));
      if (b - a < 0.4) continue;
      const fill = i % 2 ? "#111" : "#fff";
      const x = isVertical ? offset : inner.x + a;
      const y = isVertical ? inner.y + a : offset;
      const w = isVertical ? IB : (b - a);
      const h = isVertical ? (b - a) : IB;
      svg.push('<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h +
        '" fill="' + fill + '" stroke="#111" stroke-width="0.4"/>');
    }
  }
  zebra(top, "x", false, inner.y - IB);
  zebra(bottom, "x", false, inner.y + inner.h);
  zebra(left, "y", true, inner.x - IB);
  zebra(right, "y", true, inner.x + inner.w);

  // liniile interioare, punctate discret
  const tick = [];
  top.forEach(mk => tick.push('<line x1="' + (inner.x + mk.pos) + '" y1="' + inner.y +
    '" x2="' + (inner.x + mk.pos) + '" y2="' + (inner.y + inner.h) + '"/>'));
  left.forEach(mk => tick.push('<line x1="' + inner.x + '" y1="' + (inner.y + mk.pos) +
    '" x2="' + (inner.x + inner.w) + '" y2="' + (inner.y + mk.pos) + '"/>'));
  svg.push('<g fill="none" stroke="#111" stroke-width="0.35" ' +
    'stroke-dasharray="1.5,4" opacity="0.45">' + tick.join("") + "</g>");

  // etichetele de coordonate
  const labels = [];
  const seenTop = {};
  top.forEach(mk => {
    const key = Math.round(mk.pos);
    if (seenTop[key]) return;
    seenTop[key] = 1;
    labels.push('<text x="' + (inner.x + mk.pos) + '" y="' + (inner.y - IB - 3) +
      '" text-anchor="middle">' + fmtGrid(mk.value, step) + "</text>");
  });
  bottom.forEach(mk => labels.push('<text x="' + (inner.x + mk.pos) + '" y="' +
    (inner.y + inner.h + IB + 8) + '" text-anchor="middle">' +
    fmtGrid(mk.value, step) + "</text>"));
  left.forEach(mk => labels.push('<text x="' + (inner.x - IB - 4) + '" y="' +
    (inner.y + mk.pos) + '" text-anchor="middle" transform="rotate(-90 ' +
    (inner.x - IB - 4) + " " + (inner.y + mk.pos) + ')">' +
    fmtGrid(mk.value, step) + "</text>"));
  right.forEach(mk => labels.push('<text x="' + (inner.x + inner.w + IB + 5) + '" y="' +
    (inner.y + mk.pos) + '" text-anchor="middle" transform="rotate(90 ' +
    (inner.x + inner.w + IB + 5) + " " + (inner.y + mk.pos) + ')">' +
    fmtGrid(mk.value, step) + "</text>"));
  svg.push(labels.join(""));

  const unit = useST70 ? "m · Stereo 70" : "° · WGS84";
  svg.push('<text x="' + (W - 2) + '" y="' + (H - 1.5) + '" text-anchor="end" ' +
    'font-size="5.4pt" fill="#555">interval ' + fmtGrid(step, step) + " " + unit + "</text>");
  svg.push("</svg>");

  const old = holder.querySelector(".frame");
  if (old) old.remove();
  holder.insertAdjacentHTML("beforeend", svg.join(""));
}

function openPrint() {
  document.getElementById("ptitle").value = CFG.title || "";
  document.getElementById("psub").value = CFG.subtitle || "";
  pdlg.classList.add("on");
}

function closePrint() { pdlg.classList.remove("on"); }

function buildSheet() {
  const size = SHEETS[document.getElementById("psize").value] || SHEETS.a4l;
  const withLegend = document.getElementById("pleg").checked;
  const withScale = document.getElementById("pscale").checked;
  const scopeVisible = document.getElementById("pscope").value === "view";

  document.getElementById("sh_title").textContent =
    document.getElementById("ptitle").value || CFG.title || "Hartă";
  const now = new Date();
  const crsName = document.getElementById("pcrs").value;
  document.getElementById("sh_date").textContent = now.toLocaleString("ro-RO");
  document.getElementById("sh_meta").innerHTML =
    esc(document.getElementById("psub").value || "");
  document.getElementById("sh_foot").textContent = "";

  const side = document.getElementById("sh_side");
  side.style.display = withLegend ? "" : "none";
  side.innerHTML = withLegend ? "<h3>Legendă</h3>" + legendHtml(scopeVisible) : "";

  const withGrid = document.getElementById("pgrid").checked;
  const holder = document.getElementById("sh_map");
  const wMm = size[0] - (withLegend ? 48 : 0);
  holder.style.width = Math.round(wMm * MM) + "px";
  holder.style.height = Math.round((size[1] - 28) * MM) + "px";
  sheet.style.width = Math.round(size[0] * MM) + "px";

  if (printMap) { printMap.remove(); printMap = null; }
  holder.innerHTML = "";
  const inset = withGrid ? FRAME_PX : 0;
  // Rezoluția se obține randând harta la dimensiune multiplicată și micșorând-o
  // apoi prin CSS: tile-urile și vectorii se desenează la mai mulți pixeli.
  const dpiFactor = parseInt(document.getElementById("pdpi").value, 10) || 1;
  const cw = parseInt(holder.style.width, 10) - inset * 2;
  const ch = parseInt(holder.style.height, 10) - inset * 2;
  const canvas = document.createElement("div");
  canvas.className = "pmap";
  canvas.style.left = canvas.style.top = inset + "px";
  canvas.style.width = (cw * dpiFactor) + "px";
  canvas.style.height = (ch * dpiFactor) + "px";
  if (dpiFactor !== 1) canvas.style.transform = "scale(" + (1 / dpiFactor) + ")";
  holder.appendChild(canvas);
  // zoomSnap 0: scările fixe cer niveluri fracționare de zoom
  printMap = L.map(canvas, { zoomControl: false, attributionControl: false,
    zoomAnimation: false, fadeAnimation: false, preferCanvas: true,
    zoomSnap: 0, zoomDelta: 0.25 });

  if (baseLayer && document.getElementById("pbase").value === "keep") {
    const url = baseLayer._url;
    if (url) {
      const opts = Object.assign({}, baseLayer.options);
      opts.detectRetina = false;
      L.tileLayer(url, opts).addTo(printMap);
    }
  }
  // straturile vizibile se reconstruiesc din aceleași date, în ordinea din panou
  for (let i = entries.length - 1; i >= 0; i--) {
    const e = entries[i];
    if (!e.layer || !map.hasLayer(e.layer)) continue;
    try {
      if (e.kind === "vector" && e.raw) {
        const data = visibleData(e);
        if (data && data.features.length) {
          L.geoJSON(data, {
            style: styleOf,
            pointToLayer: (f, ll) => {
              const st = (f.properties && f.properties._s) || DEF;
              if (st.icon) return L.marker(ll, { icon: L.icon({ iconUrl: st.icon.src,
                iconSize: [st.icon.w, st.icon.h],
                iconAnchor: [st.icon.w / 2, st.icon.h / 2] }), interactive: false });
              return L.circleMarker(ll, Object.assign(styleOf(f),
                { radius: st.r || 5, fill: true }));
            }
          }).addTo(printMap);
        }
      } else if (e.cfg.type === "xyz") {
        L.tileLayer(e.cfg.url, { maxZoom: 22, opacity: e.cfg.opacity == null ? 1 : e.cfg.opacity,
          maxNativeZoom: e.cfg.maxZoom || 19 }).addTo(printMap);
      } else if (e.cfg.type === "wms") {
        L.tileLayer.wms(e.cfg.url, { layers: e.cfg.layers, format: e.cfg.format,
          version: e.cfg.version, transparent: true }).addTo(printMap);
      } else if (e.cfg.type === "image") {
        L.imageOverlay(e.cfg.file, e.cfg.bounds,
          { opacity: e.cfg.opacity == null ? 1 : e.cfg.opacity }).addTo(printMap);
      }
    } catch (err) { /* un strat problematic nu oprește tipărirea */ }
  }

  const mode = document.getElementById("pscale2").value;
  const zBoost = Math.log2(dpiFactor);     // păstrează scara la rezoluție mărită
  const target = scopeVisible ? map.getBounds() : bounds;
  if (mode === "fit") {
    printMap.fitBounds(target, { padding: [4 * dpiFactor, 4 * dpiFactor] });
  } else if (mode === "width") {
    // aceeași lățime de teritoriu ca pe ecran, indiferent de formatul colii
    printMap.setView(target.getCenter(), 10);
    const size2 = printMap.getSize();
    const west = printMap.project(L.latLng(target.getCenter().lat, target.getWest()), 10);
    const east = printMap.project(L.latLng(target.getCenter().lat, target.getEast()), 10);
    const need = Math.abs(east.x - west.x);
    printMap.setView(target.getCenter(),
      10 + Math.log2(size2.x / Math.max(1, need)), { animate: false });
  } else {
    printMap.setView(target.getCenter(),
      zoomForPrintScale(parseFloat(mode)) + zBoost, { animate: false });
  }
  L.control.scale({ imperial: false, position: "bottomleft", maxWidth: 140 }).addTo(printMap);
  if (withGrid) {
    printMap.whenReady(() => drawFrame(printMap, holder, crsName === "st70"));
  }
  stampSheet(printMap, withScale, crsName, dpiFactor);
  printMap._dpiFactor = dpiFactor;
  return printMap;
}

// antetul și subsolul se completează din harta de tipar, nu din cea de pe ecran
function stampSheet(m, withScale, crsName, factor) {
  const sub = document.getElementById("psub").value || "";
  document.getElementById("sh_meta").innerHTML = esc(sub) +
    (withScale ? "<br>Scara " + esc(scaleText(m, factor)) + " · " +
      (crsName === "st70" ? "Stereo 70 (EPSG:3844)" : "WGS84 (EPSG:4326)") : "");

  if (!withScale) { document.getElementById("sh_foot").textContent = ""; return; }
  const ctr = m.getCenter(), box = m.getBounds();
  let coords;
  if (crsName === "st70") {
    coords = "Centru: " + fmtST70(ctr.lat, ctr.lng) +
      "   ·   SV: " + fmtST70(box.getSouth(), box.getWest()) +
      "   ·   NE: " + fmtST70(box.getNorth(), box.getEast());
  } else {
    coords = "Centru: " + ctr.lat.toFixed(5) + ", " + ctr.lng.toFixed(5) +
      "   ·   SV: " + box.getSouth().toFixed(5) + ", " + box.getWest().toFixed(5) +
      "   ·   NE: " + box.getNorth().toFixed(5) + ", " + box.getEast().toFixed(5);
  }
  document.getElementById("sh_foot").textContent = coords;
}

function waitTiles(m, done) {
  let pendingTiles = 0, settled = false;
  const finish = () => { if (!settled) { settled = true; done(); } };
  m.eachLayer(l => {
    if (l instanceof L.TileLayer && !l.isLoading()) return;
    if (l instanceof L.TileLayer) {
      pendingTiles++;
      l.once("load", () => { if (--pendingTiles <= 0) setTimeout(finish, 250); });
    }
  });
  if (!pendingTiles) setTimeout(finish, 350);
  setTimeout(finish, 6000);   // plasă de siguranță: nu blocăm tipărirea
}

function doPrint() {
  closePrint();
  sheet.style.display = "block";
  const m = buildSheet();
  m.invalidateSize();
  waitTiles(m, () => {
    m.invalidateSize();
    stampSheet(m, document.getElementById("pscale").checked,
               document.getElementById("pcrs").value, m._dpiFactor || 1);
    if (document.getElementById("pgrid").checked) {
      drawFrame(m, document.getElementById("sh_map"),
                document.getElementById("pcrs").value === "st70");
    }
    setTimeout(() => {
      window.print();
      setTimeout(() => { sheet.style.display = ""; }, 400);
    }, 120);
  });
}

document.getElementById("pcancel").addEventListener("click", closePrint);
document.getElementById("pgo").addEventListener("click", doPrint);
document.getElementById("ppdf").addEventListener("click", savePdf);
pdlg.addEventListener("click", ev => { if (ev.target === pdlg) closePrint(); });
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") closePrint();
  if ((ev.ctrlKey || ev.metaKey) && ev.key === "p") { ev.preventDefault(); openPrint(); }
});
if (W.print) toolButton("print", "Tipărește harta cu legendă", openPrint);

/* panoul de straturi ----------------------------------------------------- */
const panelBox = document.getElementById("panel");
const layersBtn = toolButton("layers", "Ascunde / afișează panoul de straturi", b => {
  const hidden = panelBox.classList.toggle("hidden");
  b.classList.toggle("on", hidden);
});
tbar.insertBefore(layersBtn, tbar.firstChild);
document.getElementById("hidePanel").addEventListener("click", () => {
  panelBox.classList.add("hidden");
  layersBtn.classList.add("on");
});
document.getElementById("collapseAll").addEventListener("click", () => {
  const rows = Array.prototype.slice.call(panel.children)
    .filter(r => r.querySelector(".exp") && !r.querySelector(".exp.void"));
  const anyOpen = rows.some(r => !r.classList.contains("collapsed"));
  rows.forEach(r => r.classList.toggle("collapsed", anyOpen));
});
</script>
